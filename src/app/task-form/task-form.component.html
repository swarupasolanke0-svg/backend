<div class="card">
  <h3>{{ taskToEdit ? 'Edit Task' : 'Add New Task' }}</h3>
  <form (ngSubmit)="onSubmit()">
    <label>Title</label>
    <input type="text" [(ngModel)]="formModel.title" name="title" required placeholder="Task title" />

    <label>Description</label>
    <textarea [(ngModel)]="formModel.description" name="description" rows="3" placeholder="Task description"></textarea>

    <label>Status</label>
    <select [(ngModel)]="formModel.status" name="status">
      <option value="pending">Pending</option>
      <option value="in-progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>

    <button type="submit" class="btn-primary">{{ taskToEdit ? 'Update' : 'Add' }} Task</button>
    <button type="button" class="btn-secondary" (click)="onCancel()" *ngIf="taskToEdit">Cancel</button>
  </form>
</div>
